server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # Сжатие на лету (fallback, если нет предсжатых .gz)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Отдавать заранее сжатые .gz (сгенерированы vite-plugin-compression при сборке)
    gzip_static on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML — без кеша, чтобы новые билды подхватывались сразу
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
