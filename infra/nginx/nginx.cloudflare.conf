worker_processes auto;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream api_backend     { server api:8000; }
    upstream miniapp_backend { server mini-app:5173; }
    upstream bot_tg_backend   { server bot-tg:8081; }

    # ── app.freelance-gid.online — Mini-App + API proxy ──────────────
    server {
        listen 80;
        server_name app.freelance-gid.online;

        # API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass       http://api_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/ai/chat/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # Mini-App static files
        location / {
            proxy_pass       http://miniapp_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── api.freelance-gid.online — API direct ────────────────────────
    server {
        listen 80;
        server_name api.freelance-gid.online;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass       http://api_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /webhook/tg {
            proxy_pass           http://bot_tg_backend;
            client_max_body_size 10m;
            proxy_set_header     Host $host;
            proxy_set_header     X-Forwarded-Proto https;
        }

        location /webhook/ {
            proxy_pass           http://api_backend;
            client_max_body_size 50m;
            proxy_set_header     Host $host;
            proxy_set_header     X-Forwarded-Proto https;
        }

        location /health {
            proxy_pass http://api_backend;
        }

        location /docs {
            proxy_pass http://api_backend;
        }

        location /openapi.json {
            proxy_pass http://api_backend;
        }

        location /redoc {
            proxy_pass http://api_backend;
        }
    }

    # ── Default — health check ───────────────────────────────────────
    server {
        listen 80 default_server;
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
        location / {
            return 404;
        }
    }
}
