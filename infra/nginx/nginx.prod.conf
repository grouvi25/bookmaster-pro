worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Upstream'ы
    upstream api        { server api:8000; }
    upstream marketplace { server marketplace:3000; }
    upstream bot_max    { server bot-max:8082; }

    # ── HTTP → HTTPS редирект ──────────────────────────────────────────
    server {
        listen 80;
        server_name bookmaster.pro api.bookmaster.pro app.bookmaster.pro;
        return 301 https://$host$request_uri;
    }

    # ── API ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.bookmaster.pro;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass       http://api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Auth — строже лимит
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass       http://api;
            proxy_set_header Host $host;
        }

        # WebSocket для AI чата
        location /api/v1/ai/chat/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Webhooks — без лимитов (ЮKassa, Telegram)
        location /webhook/ {
            proxy_pass           http://api;
            client_max_body_size 50m;
            proxy_set_header     Host $host;
        }

        # Health check
        location /health {
            proxy_pass http://api;
        }
    }

    # ── Маркетплейс ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name bookmaster.pro www.bookmaster.pro;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass       http://marketplace;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Кэшируем статические страницы 5 минут
            proxy_cache_valid 200 5m;
        }
    }

    # ── MAX Bot Webhook ───────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name bot-max.bookmaster.pro;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location /webhook/max {
            proxy_pass http://bot_max;
        }
    }
}
