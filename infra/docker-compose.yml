version: '3.9'

services:
  # ── БАЗА ДАННЫХ ─────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: bookmaster_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookmaster
      POSTGRES_USER: bookmaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmaster"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── REDIS ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bookmaster_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API ──────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: bookmaster_api
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── SCHEDULER ───────────────────────────────────────────
  scheduler:
    build:
      context: ..
      dockerfile: apps/scheduler/Dockerfile
    container_name: bookmaster_scheduler
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── NGINX ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bookmaster_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

  # ── TELEGRAM BOT ─────────────────────────────────────────
  bot-tg:
    build:
      context: ..
      dockerfile: apps/bot-tg/Dockerfile
    container_name: bookmaster_bot_tg
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - db
      - redis

  # ── MAX BOT ─────────────────────────────────────────────
  bot-max:
    build:
      context: ..
      dockerfile: apps/bot-max/Dockerfile
    container_name: bookmaster_bot_max
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8082:8082"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  redisdata:
