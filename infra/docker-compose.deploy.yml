x-restart: &restart
  restart: unless-stopped

x-env: &env
  env_file: ../.env

services:
  db:
    <<: *restart
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    container_name: bm_db
    environment:
      POSTGRES_DB: bookmaster
      POSTGRES_USER: bookmaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prodpassword42}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_extensions.sql:/docker-entrypoint-initdb.d/01_ext.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks: [bookmaster]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmaster"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *restart
    image: redis:7-alpine
    container_name: bm_redis
    # Если REDIS_PASSWORD задан в .env — Redis стартует с авторизацией.
    # Если пуст — стартует без пароля (для локального dev).
    # Совпадает с REDIS_URL=redis://:<password>@redis:6379/0 в .env.
    env_file: ../.env
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --appendonly yes;
      fi
      '
    volumes: [redisdata:/data]
    ports:
      - "127.0.0.1:6379:6379"
    networks: [bookmaster]
    healthcheck:
      # Если REDIS_PASSWORD пуст — ping без авторизации; иначе с -a
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping || exit 1"]
      interval: 10s

  api:
    <<: [*restart, *env]
    container_name: bm_api
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "bookmaster/api"
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${T_BANK_CERT_PATH:-/dev/null}:/etc/tbank/cert.pem:ro
      - ${T_BANK_KEY_PATH:-/dev/null}:/etc/tbank/key.pem:ro
    networks: [bookmaster]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot-tg:
    <<: [*restart, *env]
    container_name: bm_bot_tg
    build:
      context: ..
      dockerfile: apps/bot-tg/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    networks: [bookmaster]

  mini-app:
    <<: *restart
    container_name: bm_mini_app
    build:
      context: ..
      dockerfile: apps/mini-app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.dealmaster.ru}
        VITE_TG_BOT_USERNAME: ${VITE_TG_BOT_USERNAME}
        VITE_APP_URL: ${VITE_APP_URL:-https://app.dealmaster.ru}
    ports:
      - "127.0.0.1:5173:5173"
    networks: [bookmaster]

  bot-max:
    <<: [*restart, *env]
    container_name: bm_bot_max
    build:
      context: ..
      dockerfile: apps/bot-max/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:8082:8082"
    networks: [bookmaster]

  scheduler:
    <<: [*restart, *env]
    container_name: bm_scheduler
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "bookmaster/scheduler"
    build:
      context: ..
      dockerfile: apps/scheduler/Dockerfile
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ${T_BANK_CERT_PATH:-/dev/null}:/etc/tbank/cert.pem:ro
      - ${T_BANK_KEY_PATH:-/dev/null}:/etc/tbank/key.pem:ro
    networks: [bookmaster]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  marketplace:
    <<: [*restart, *env]
    container_name: bm_marketplace
    build:
      context: ..
      dockerfile: apps/marketplace/Dockerfile
    environment:
      API_URL: http://api:8000/api/v1
      APP_URL: ${APP_URL:-https://app.dealmaster.ru}
      NEXT_PUBLIC_TG_BOT_USERNAME: ${TG_BOT_USERNAME:-swift_sellbot}
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      api: { condition: service_healthy }
    networks: [bookmaster]

volumes:
  pgdata:
  redisdata:

networks:
  bookmaster:
    driver: bridge
