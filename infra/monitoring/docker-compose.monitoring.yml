# Стек мониторинга — Prometheus + Grafana
# Запуск: docker compose -f docker-compose.monitoring.yml up -d
# Grafana: http://localhost:3001 (admin/admin)
# Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: bm_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    networks: [bookmaster]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: bm_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-bookmaster2024}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [bookmaster]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: bm_node_exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    networks: [bookmaster]

volumes:
  prometheus_data:
  grafana_data:

networks:
  bookmaster:
    external: true
    name: infra_bookmaster
